<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skills War Chest</title>
<meta name="description" content="A searchable, rated index of agent skills gathered from across GitHub.">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23100e0c'/><path d='M5 12h22v13a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2z' fill='%23c79a4b'/><path d='M5 12c0-3.9 4.9-7 11-7s11 3.1 11 7z' fill='%23e8c47f'/><rect x='14' y='14' width='4' height='7' rx='1' fill='%23100e0c'/></svg>">
<!--WARCHEST_STYLE-->
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <button class="tbtn mobtoggle" id="menubtn" aria-label="Filters">☰</button>
    <div class="brand" id="brand" title="Reset all filters">
      <h1>Skills War Chest</h1>
      <span class="count hide-sm" id="count">loading…</span>
    </div>

    <div class="searchwrap">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" autocomplete="off" spellcheck="false"
             placeholder="Search skills — or  tag:animation  origin:google  score:>85  stars:>=4"
             aria-label="Search skills">
      <kbd>/</kbd>
    </div>

    <div class="tools">
    <button class="tbtn" id="ratebtn" title="Your ratings">★<span class="hide-sm">&nbsp;Ratings</span></button>
    <button class="tbtn" id="kitbtn" title="Your install kit">◆<span class="hide-sm">&nbsp;Kit</span><span class="pill" id="kitcount"></span></button>
    <button class="tbtn" id="cmpbtn" title="Compare tray">⇄<span class="hide-sm">&nbsp;Compare</span><span class="pill" id="cmpcount"></span></button>
    <button class="tbtn hide-sm" id="dupbtn" title="Near-duplicates">⧉</button>
    <button class="tbtn hide-sm" id="statsbtn" title="Stats">▤</button>
    <button class="tbtn hide-sm" id="creditbtn" title="Credits &amp; sources">©</button>
    <button class="tbtn" id="helpbtn" title="Help (?)">?</button>
    <button class="tbtn" id="themebtn" title="Toggle theme">◑</button>
    </div>
  </header>

  <div class="body">
    <div class="sidescrim" id="sidescrim"></div>
    <nav class="sidebar" id="sidebar" aria-label="Filters">
      <div class="sidehead">
        <h2>Filters</h2>
        <button class="dclose" id="sideclose" aria-label="Close filters">✕</button>
      </div>
      <div class="facets" id="facets"></div>
      <div class="sideapply">
        <button id="sideapply" type="button">Show results</button>
      </div>
    </nav>

    <main class="main" id="main">
      <div class="mainbar">
        <span class="resultline" id="resultline">…</span>
        <span class="spacer"></span>
        <label class="sr" for="sort">Sort</label>
        <select class="mini" id="sort">
          <option value="balanced">balanced</option>
          <option value="score">forge score</option>
          <option value="stars">my rating</option>
          <option value="name">name</option>
          <option value="origin">origin</option>
          <option value="size">longest</option>
          <option value="smallest">shortest</option>
        </select>
        <button class="tbtn" id="viewbtn" title="Grid / list">▦</button>
      </div>
      <div class="chips" id="chips"></div>
      <div class="grid" id="grid"></div>
    </main>
  </div>
</div>

<div class="scrim" id="scrim"></div>

<aside class="drawer" id="drawer" aria-label="Skill detail">
  <div class="dhead" id="dhead"></div>
  <div class="dbody" id="dbody"></div>
</aside>

<div class="modal" id="modal" role="dialog" aria-modal="true">
  <div class="sheet">
    <div style="display:flex;align-items:flex-start;gap:12px">
      <div style="flex:1">
        <h3 id="mtitle"></h3>
        <div class="sub" id="msub"></div>
      </div>
      <button class="dclose" id="mclose" aria-label="Close">✕</button>
    </div>
    <div id="mbody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!--WARCHEST_DATA-->
<!--WARCHEST_SCRIPT-->
<script src="app.js"></script>
</body>
</html>
